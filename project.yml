# XcodeGen 备用配置：如果手写的 Bucang.xcodeproj 打不开或编译报错，
# 在 Mac 上装 XcodeGen（brew install xcodegen），在这个目录运行 `xcodegen`，
# 它会按本文件重新生成一个干净的 Bucang.xcodeproj，再用 Xcode 打开即可。
# 正常情况下不需要这一步，GitHub Actions 直接用手写的工程文件编译。
name: Bucang
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Bucang:
    type: application
    platform: iOS
    sources:
      - Bucang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bucang
        PRODUCT_NAME: Bucang
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
